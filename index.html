<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pixel World 10K - Global</title>
    <script src="https://unpkg.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #f0f0f0; font-family: sans-serif; }
        #menu {
            position: absolute; inset: 0; background: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        .card { border: 2px solid #000; padding: 30px; text-align: center; width: 320px; background: white; }
        button {
            width: 100%; padding: 10px; margin: 5px 0; border: 2px solid #000;
            background: white; cursor: pointer; font-weight: bold;
        }
        button:hover { background: #eee; }
        input { width: 100%; padding: 8px; margin: 5px 0; border: 2px solid #000; box-sizing: border-box; }
        
        #game-ui {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            background: white; border: 2px solid #000; padding: 10px; display: none;
        }
        canvas { cursor: crosshair; image-rendering: pixelated; }
        .active-tool { background: #000 !important; color: white !important; }
    </style>
</head>
<body>

<div id="menu">
    <div class="card">
        <h1 style="margin-top:0">PIXEL WORLD</h1>
        <button onclick="startMode('solo')">MUNDO SOLITARIO</button>
        <button onclick="startMode('server')">MUNDO SERVER (GLOBAL)</button>
        <hr>
        <input type="text" id="join-id" placeholder="ID de amigo">
        <button onclick="connectToFriend()">UNIRSE A AMIGO</button>
    </div>
</div>

<div id="game-ui">
    <div id="mode-info" style="font-weight:bold; margin-bottom:5px"></div>
    <div id="id-info" style="font-size:11px; margin-bottom:10px"></div>
    
    <input type="color" id="colorPicker" value="#000000">
    <button id="btn-paint" class="active-tool" onclick="setTool('paint')">LÁPIZ</button>
    <button id="btn-erase" onclick="setTool('erase')">GOMA</button>
    <button onclick="goOnline()">CREAR MUNDO ONLINE</button>
    <button onclick="location.reload()">SALIR</button>
</div>

<canvas id="pixelCanvas"></canvas>

<script>
    const canvas = document.getElementById('pixelCanvas');
    const ctx = canvas.getContext('2d');
    let width = window.innerWidth, height = window.innerHeight;
    let cameraX = 5000, cameraY = 5000, zoom = 20;
    
    let pixels = new Map();
    let mode = 'solo';
    let tool = 'paint';
    let peer = null;
    let connections = []; // Lista para modo server o múltiples amigos

    // Cargar LocalStorage
    const savedData = localStorage.getItem('pixel_map');
    if (savedData) {
        pixels = new Map(JSON.parse(savedData));
    }

    function startMode(m) {
        mode = m;
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game-ui').style.display = 'block';
        document.getElementById('mode-info').innerText = m.toUpperCase();
        
        if (m === 'server') initServerMode();
        initCanvas();
    }

    function setTool(t) {
        tool = t;
        document.getElementById('btn-paint').className = t === 'paint' ? 'active-tool' : '';
        document.getElementById('btn-erase').className = t === 'erase' ? 'active-tool' : '';
    }

    // --- RED ---
    function goOnline() {
        if (peer) return alert("Ya estás online. Tu ID: " + peer.id);
        const myId = prompt("Crea una ID para tu mundo:", "mundo-" + Math.floor(Math.random()*1000));
        if (!myId) return;
        
        peer = new Peer(myId);
        peer.on('open', (id) => {
            document.getElementById('id-info').innerText = "Tu ID Online: " + id;
            alert("Mundo Online Creado. Comparte tu ID.");
        });
        peer.on('connection', setupConn);
    }

    function connectToFriend() {
        const friendId = document.getElementById('join-id').value;
        if (!friendId) return;
        peer = new Peer();
        peer.on('open', () => {
            const conn = peer.connect(friendId);
            setupConn(conn);
            startMode('amigo');
        });
    }

    function initServerMode() {
        // En un mundo real esto conectaría a un servidor. 
        // Aquí usamos una ID "Global" para que todos se encuentren.
        peer = new Peer('pixel-global-server-room'); 
        peer.on('open', () => console.log("Conectado al servidor global"));
        peer.on('connection', setupConn);
        peer.on('error', () => {
            // Si el servidor global ya está creado, nos unimos a él
            const conn = peer.connect('pixel-global-server-room');
            setupConn(conn);
        });
    }

    function setupConn(conn) {
        connections.push(conn);
        conn.on('data', (data) => {
            if (data.type === 'erase') pixels.delete(`${data.x},${data.y}`);
            else pixels.set(`${data.x},${data.y}`, data.color);
            render();
        });
    }

    // --- JUEGO ---
    function initCanvas() {
        canvas.width = width;
        canvas.height = height;
        render();
    }

    function render() {
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, width, height);

        const startX = Math.floor(cameraX - (width/2)/zoom);
        const endX = Math.ceil(cameraX + (width/2)/zoom);
        const startY = Math.floor(cameraY - (height/2)/zoom);
        const endY = Math.ceil(cameraY + (height/2)/zoom);

        pixels.forEach((color, key) => {
            const [x, y] = key.split(',').map(Number);
            if (x >= startX && x <= endX && y >= startY && y <= endY) {
                ctx.fillStyle = color;
                ctx.fillRect((x - cameraX) * zoom + width / 2, (y - cameraY) * zoom + height / 2, zoom, zoom);
            }
        });
    }

    function paint(e) {
        const worldX = Math.floor((e.clientX - width/2)/zoom + cameraX);
        const worldY = Math.floor((e.clientY - height/2)/zoom + cameraY);
        
        if (tool === 'paint') {
            const color = document.getElementById('colorPicker').value;
            pixels.set(`${worldX},${worldY}`, color);
            broadcast({ x: worldX, y: worldY, color: color, type: 'paint' });
        } else {
            pixels.delete(`${worldX},${worldY}`);
            broadcast({ x: worldX, y: worldY, type: 'erase' });
        }

        localStorage.setItem('pixel_map', JSON.stringify([...pixels]));
        render();
    }

    function broadcast(data) {
        connections.forEach(conn => {
            if (conn.open) conn.send(data);
        });
    }

    // --- CONTROLES ---
    let isDragging = false, lastX, lastY;
    canvas.onmousedown = (e) => {
        if (e.button === 0) paint(e);
        if (e.button === 2) isDragging = true;
        lastX = e.clientX; lastY = e.clientY;
    };
    window.onmousemove = (e) => {
        if (isDragging) {
            cameraX -= (e.clientX - lastX) / zoom;
            cameraY -= (e.clientY - lastY) / zoom;
            lastX = e.clientX; lastY = e.clientY;
            render();
        }
    };
    window.onmouseup = () => isDragging = false;
    window.oncontextmenu = e => e.preventDefault();
    canvas.onwheel = (e) => {
        zoom = Math.min(Math.max(e.deltaY > 0 ? zoom * 0.8 : zoom * 1.2, 0.5), 100);
        render();
    };
    window.onresize = () => { width = window.innerWidth; height = window.innerHeight; initCanvas(); };
</script>
</body>
</html>
