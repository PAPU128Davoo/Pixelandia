<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pixel World 10K - Multijugador</title>
    <script src="https://unpkg.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #fff; font-family: sans-serif; touch-action: none; }
        #menu { position: absolute; inset: 0; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .card { border: 3px solid #000; padding: 30px; text-align: center; width: 320px; box-shadow: 8px 8px 0 #000; }
        button { width: 100%; padding: 12px; margin: 5px 0; border: 2px solid #000; background: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #000; color: white; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 2px solid #000; box-sizing: border-box; }
        #game-ui { position: absolute; top: 10px; left: 10px; z-index: 10; background: white; border: 3px solid #000; padding: 15px; display: none; }
        canvas { cursor: crosshair; image-rendering: pixelated; display: block; }
        .active-tool { background: #000 !important; color: white !important; }
        .status { font-size: 11px; color: #444; margin: 5px 0; font-weight: bold; }
        .id-label { background: #f0f0f0; padding: 5px; font-family: monospace; border: 1px dashed #000; font-size: 12px; margin: 5px 0; }
    </style>
</head>
<body>

<div id="menu">
    <div class="card">
        <h1 style="margin-top:0">PIXEL WORLD</h1>
        <button onclick="startMode('SOLITARIO')">MUNDO SOLITARIO</button>
        <button onclick="startMode('SERVER GLOBAL')">MUNDO SERVER GLOBAL</button>
        <hr style="border: 1px solid #000; margin: 15px 0;">
        <input type="text" id="join-id" placeholder="ID DEL AMIGO">
        <button onclick="connectToFriend()" style="background: #00ff00;">UNIRSE A AMIGO</button>
    </div>
</div>

<div id="game-ui">
    <div id="mode-info" style="font-weight:bold; font-size: 16px; color: #007bff;">MODO</div>
    <div id="online-status" class="status">Offline</div>
    
    <div id="online-controls">
        <button onclick="goOnline()" style="background: #e1f5fe;">VOLVER MULTIJUGADOR ONLINE</button>
    </div>
    
    <div id="host-panel" style="display:none;">
        <div style="font-size:10px; color:#666;">TU ID DE MUNDO:</div>
        <div id="my-id-display" class="id-label"></div>
        <button onclick="location.reload()" style="color:red; border-color:red; font-size:10px; padding:4px;">CERRAR MUNDO</button>
    </div>

    <hr style="margin: 10px 0; border:0; border-top:1px solid #000;">
    <input type="color" id="colorPicker" value="#000000" style="width:100%; height:35px; border:2px solid #000; cursor:pointer;">
    <div style="display:flex; gap:5px; margin-top:5px">
        <button id="btn-paint" class="active-tool" onclick="setTool('paint')">LÁPIZ</button>
        <button id="btn-erase" onclick="setTool('erase')">GOMA</button>
    </div>
    <button onclick="location.reload()" style="margin-top:15px; font-size: 10px;">SALIR</button>
</div>

<canvas id="pixelCanvas"></canvas>

<script>
    const canvas = document.getElementById('pixelCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, cameraX = 5000, cameraY = 5000, zoom = 20;
    let pixels = new Map(), tool = 'paint';
    let peer = null, connections = [], isDrawing = false, isDragging = false;

    // LocalStorage para no perder lo que pintas
    const saved = localStorage.getItem('pixel_v5');
    if (saved) pixels = new Map(JSON.parse(saved));

    function startMode(m) {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game-ui').style.display = 'block';
        
        if (m === 'SERVER GLOBAL') {
            document.getElementById('mode-info').innerText = "MULTIJUGADOR ONLINE (SERVER)";
            document.getElementById('online-controls').style.display = 'none';
            initServer();
        } else {
            document.getElementById('mode-info').innerText = m;
        }
        resize();
        render();
    }

    // --- LÓGICA MULTIJUGADOR ---
    function goOnline() {
        const id = prompt("Nombra tu mundo online:");
        if (!id) return;
        
        peer = new Peer(id);
        peer.on('open', (openedId) => {
            document.getElementById('mode-info').innerText = "MULTIJUGADOR ONLINE";
            document.getElementById('online-status').innerText = "Estado: HOSTING ✅";
            document.getElementById('my-id-display').innerText = openedId;
            document.getElementById('online-controls').style.display = 'none';
            document.getElementById('host-panel').style.display = 'block';
        });

        peer.on('connection', setupConnection);
        peer.on('error', () => alert("Esa ID ya está en uso."));
    }

    function connectToFriend() {
        const id = document.getElementById('join-id').value.trim();
        if (!id) return;

        peer = new Peer();
        peer.on('open', () => {
            const conn = peer.connect(id);
            setupConnection(conn);
            startMode('MULTIJUGADOR ONLINE');
            document.getElementById('online-controls').style.display = 'none';
            document.getElementById('online-status').innerText = "Conectando con amigo...";
        });
    }

    function initServer() {
        // En el Server Global, el primero que entra es el "Master"
        const serverId = 'pixel-server-global-999';
        peer = new Peer();
        peer.on('open', () => {
            const conn = peer.connect(serverId);
            setupConnection(conn);
        });

        const masterPeer = new Peer(serverId);
        masterPeer.on('connection', setupConnection);
        masterPeer.on('error', () => console.log("Unido como participante"));
    }

    function setupConnection(conn) {
        connections.push(conn);
        conn.on('open', () => {
            document.getElementById('online-status').innerText = "Estado: SINCRONIZADO ✅";
            // El host envía el mapa completo al nuevo
            if (peer.id.includes('server') || document.getElementById('host-panel').style.display === 'block') {
                conn.send({ type: 'full-map', data: [...pixels] });
            }
        });

        conn.on('data', (data) => {
            if (data.type === 'full-map') pixels = new Map(data.data);
            else if (data.type === 'erase') pixels.delete(`${data.x},${data.y}`);
            else pixels.set(`${data.x},${data.y}`, data.color);
            render();
            // Re-enviar a otros para que todos lo vean (Relay)
            if (connections.length > 1) broadcast(data, conn);
        });
    }

    function broadcast(data, excludeConn = null) {
        connections.forEach(c => {
            if (c.open && c !== excludeConn) c.send(data);
        });
    }

    // --- DIBUJO ---
    function paint(e) {
        const x = Math.floor((e.clientX - width/2)/zoom + cameraX);
        const y = Math.floor((e.clientY - height/2)/zoom + cameraY);
        const key = `${x},${y}`;

        if (tool === 'paint') {
            const color = document.getElementById('colorPicker').value;
            if(pixels.get(key) === color) return;
            pixels.set(key, color);
            broadcast({ x, y, color, type: 'paint' });
        } else {
            if(!pixels.has(key)) return;
            pixels.delete(key);
            broadcast({ x, y, type: 'erase' });
        }
        localStorage.setItem('pixel_v5', JSON.stringify([...pixels]));
        render();
    }

    function render() {
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, width, height);
        const sX = cameraX - (width/2)/zoom, eX = cameraX + (width/2)/zoom;
        const sY = cameraY - (height/2)/zoom, eY = cameraY + (height/2)/zoom;

        pixels.forEach((color, key) => {
            const [px, py] = key.split(',').map(Number);
            if (px >= sX-1 && px <= eX+1 && py >= sY-1 && py <= eY+1) {
                ctx.fillStyle = color;
                ctx.fillRect((px - cameraX) * zoom + width/2, (py - cameraY) * zoom + height/2, zoom + 0.5, zoom + 0.5);
            }
        });
    }

    // --- CONTROLES ---
    canvas.onmousedown = (e) => {
        if (e.button === 0) { isDrawing = true; paint(e); }
        if (e.button === 2) isDragging = true;
    };
    window.onmousemove = (e) => {
        if (isDrawing) paint(e);
        if (isDragging) { cameraX -= e.movementX/zoom; cameraY -= e.movementY/zoom; render(); }
    };
    window.onmouseup = () => { isDrawing = false; isDragging = false; };
    canvas.onwheel = (e) => {
        zoom = Math.min(Math.max(e.deltaY > 0 ? zoom * 0.8 : zoom * 1.2, 0.5), 150);
        render();
    };
    function resize() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
    window.onresize = resize;
    window.oncontextmenu = e => e.preventDefault();
    function setTool(t) { tool = t; document.getElementById('btn-paint').className = t === 'paint' ? 'active-tool' : ''; document.getElementById('btn-erase').className = t === 'erase' ? 'active-tool' : ''; }
</script>
</body>
</html>
