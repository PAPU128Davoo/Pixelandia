<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pixel World 10K - Online Fix</title>
    <script src="https://unpkg.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #fff; font-family: sans-serif; touch-action: none; }
        #menu { position: absolute; inset: 0; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .card { border: 3px solid #000; padding: 30px; text-align: center; width: 320px; box-shadow: 10px 10px 0 #000; }
        button { width: 100%; padding: 10px; margin: 5px 0; border: 2px solid #000; background: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #000; color: white; }
        input { width: 100%; padding: 8px; margin: 5px 0; border: 2px solid #000; box-sizing: border-box; }
        #game-ui { position: absolute; top: 10px; left: 10px; z-index: 10; background: white; border: 3px solid #000; padding: 15px; display: none; }
        canvas { cursor: crosshair; image-rendering: pixelated; display: block; }
        .active-tool { background: #000 !important; color: white !important; }
        .status { font-size: 10px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>

<div id="menu">
    <div class="card">
        <h1>PIXEL WORLD</h1>
        <button onclick="startMode('solo')">MUNDO SOLITARIO</button>
        <button onclick="startMode('server')">MUNDO SERVER (GLOBAL)</button>
        <hr style="border: 1px solid #000; margin: 15px 0;">
        <input type="text" id="join-id" placeholder="ID de amigo">
        <button onclick="connectToFriend()">UNIRSE A AMIGO</button>
    </div>
</div>

<div id="game-ui">
    <div id="mode-info" style="font-weight:bold;">MODO</div>
    <div id="online-status" class="status">Desconectado</div>
    <div id="host-panel" style="display:none; margin-top:5px;">
        <div id="my-id-display" style="font-size:11px; background:#eee; padding:3px;"></div>
        <button onclick="location.reload()" style="color:red; border-color:red; font-size:10px; padding:2px;">CERRAR</button>
    </div>
    <button id="btn-online" onclick="goOnline()" style="font-size:11px; margin-top:5px;">CREAR MUNDO ONLINE</button>
    <hr style="margin: 10px 0; border:0; border-top:1px solid #000;">
    <input type="color" id="colorPicker" value="#000000" style="width:100%;">
    <div style="display:flex; gap:5px; margin-top:5px">
        <button id="btn-paint" class="active-tool" onclick="setTool('paint')">LÁPIZ</button>
        <button id="btn-erase" onclick="setTool('erase')">GOMA</button>
    </div>
</div>

<canvas id="pixelCanvas"></canvas>

<script>
    const canvas = document.getElementById('pixelCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, cameraX = 5000, cameraY = 5000, zoom = 20;
    let pixels = new Map(), mode = 'solo', tool = 'paint';
    let peer = null, connections = [], isDrawing = false, isDragging = false;

    // Cargar LocalStorage
    const saved = localStorage.getItem('pixel_map_v3');
    if (saved) pixels = new Map(JSON.parse(saved));

    function startMode(m) {
        mode = m;
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game-ui').style.display = 'block';
        document.getElementById('mode-info').innerText = m === 'server' ? '🌐 MUNDO SERVER' : '👤 SOLITARIO';
        if (m === 'server') initServer();
        resize();
        render();
    }

    // --- LÓGICA ONLINE (PEERJS) ---
    function initPeer(customId = null) {
        peer = customId ? new Peer(customId) : new Peer();
        
        peer.on('open', (id) => {
            document.getElementById('online-status').innerText = "Conectado como: " + id;
            if (mode === 'hosting') {
                document.getElementById('my-id-display').innerText = "ID: " + id;
                document.getElementById('host-panel').style.display = 'block';
                document.getElementById('btn-online').style.display = 'none';
            }
        });

        peer.on('connection', (conn) => {
            setupConnection(conn);
        });

        peer.on('error', (err) => {
            console.error(err);
            if (err.type === 'unavailable-id' && mode === 'server') {
                // Si la sala server ya existe, nos unimos como cliente
                mode = 'server-client';
                const conn = peer.connect('pixel-global-room-10k');
                setupConnection(conn);
            }
        });
    }

    function goOnline() {
        mode = 'hosting';
        const id = prompt("Nombra tu mundo:", "mundo-" + Math.floor(Math.random()*999));
        if (id) initPeer(id);
    }

    function connectToFriend() {
        const id = document.getElementById('join-id').value;
        if (!id) return;
        mode = 'friend-client';
        peer = new Peer();
        peer.on('open', () => {
            const conn = peer.connect(id);
            setupConnection(conn);
            startMode('amigo');
        });
    }

    function initServer() {
        // Intentamos ser el Host del server global
        mode = 'server';
        initPeer('pixel-global-room-10k');
    }

    function setupConnection(conn) {
        connections.push(conn);
        conn.on('open', () => {
            document.getElementById('online-status').innerText = "En línea (Sincronizado)";
            // Enviar mapa actual al nuevo conectado si somos host
            if (mode === 'hosting' || mode === 'server') {
                conn.send({ type: 'full-map', data: [...pixels] });
            }
        });
        conn.on('data', (data) => {
            if (data.type === 'full-map') {
                pixels = new Map(data.data);
            } else if (data.type === 'erase') {
                pixels.delete(`${data.x},${data.y}`);
            } else {
                pixels.set(`${data.x},${data.y}`, data.color);
            }
            render();
        });
    }

    function broadcast(data) {
        connections.forEach(c => { if (c.open) c.send(data); });
    }

    // --- DIBUJO ---
    function paint(e) {
        const x = Math.floor((e.clientX - width/2)/zoom + cameraX);
        const y = Math.floor((e.clientY - height/2)/zoom + cameraY);
        const key = `${x},${y}`;

        if (tool === 'paint') {
            const color = document.getElementById('colorPicker').value;
            pixels.set(key, color);
            broadcast({ x, y, color, type: 'paint' });
        } else {
            pixels.delete(key);
            broadcast({ x, y, type: 'erase' });
        }
        localStorage.setItem('pixel_map_v3', JSON.stringify([...pixels]));
        render();
    }

    function render() {
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, width, height);
        const sX = cameraX - (width/2)/zoom, eX = cameraX + (width/2)/zoom;
        const sY = cameraY - (height/2)/zoom, eY = cameraY + (height/2)/zoom;

        pixels.forEach((color, key) => {
            const [x, y] = key.split(',').map(Number);
            if (x >= sX-1 && x <= eX+1 && y >= sY-1 && y <= eY+1) {
                ctx.fillStyle = color;
                ctx.fillRect((x - cameraX) * zoom + width/2, (y - cameraY) * zoom + height/2, zoom + 0.5, zoom + 0.5);
            }
        });
    }

    // --- EVENTOS ---
    canvas.onmousedown = (e) => {
        if (e.button === 0) { isDrawing = true; paint(e); }
        if (e.button === 2) isDragging = true;
    };
    window.onmousemove = (e) => {
        if (isDrawing) paint(e);
        if (isDragging) { cameraX -= e.movementX/zoom; cameraY -= e.movementY/zoom; render(); }
    };
    window.onmouseup = () => { isDrawing = false; isDragging = false; };
    canvas.onwheel = (e) => {
        zoom = Math.min(Math.max(e.deltaY > 0 ? zoom * 0.8 : zoom * 1.2, 0.5), 150);
        render();
    };
    function resize() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
    window.onresize = resize;
    window.oncontextmenu = e => e.preventDefault();
    function setTool(t) { tool = t; document.getElementById('btn-paint').className = t === 'paint' ? 'active-tool' : ''; document.getElementById('btn-erase').className = t === 'erase' ? 'active-tool' : ''; }
</script>
</body>
</html>
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pixel World 10K - Global</title>
    <script src="https://unpkg.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #f0f0f0; font-family: sans-serif; }
        #menu {
            position: absolute; inset: 0; background: white;
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        .card { border: 2px solid #000; padding: 30px; text-align: center; width: 320px; background: white; }
        button {
            width: 100%; padding: 10px; margin: 5px 0; border: 2px solid #000;
            background: white; cursor: pointer; font-weight: bold;
        }
        button:hover { background: #eee; }
        input { width: 100%; padding: 8px; margin: 5px 0; border: 2px solid #000; box-sizing: border-box; }
        
        #game-ui {
            position: absolute; top: 10px; left: 10px; z-index: 10;
            background: white; border: 2px solid #000; padding: 10px; display: none;
        }
        canvas { cursor: crosshair; image-rendering: pixelated; }
        .active-tool { background: #000 !important; color: white !important; }
    </style>
</head>
<body>

<div id="menu">
    <div class="card">
        <h1 style="margin-top:0">PIXEL WORLD</h1>
        <button onclick="startMode('solo')">MUNDO SOLITARIO</button>
        <button onclick="startMode('server')">MUNDO SERVER (GLOBAL)</button>
        <hr>
        <input type="text" id="join-id" placeholder="ID de amigo">
        <button onclick="connectToFriend()">UNIRSE A AMIGO</button>
    </div>
</div>

<div id="game-ui">
    <div id="mode-info" style="font-weight:bold; margin-bottom:5px"></div>
    <div id="id-info" style="font-size:11px; margin-bottom:10px"></div>
    
    <input type="color" id="colorPicker" value="#000000">
    <button id="btn-paint" class="active-tool" onclick="setTool('paint')">LÁPIZ</button>
    <button id="btn-erase" onclick="setTool('erase')">GOMA</button>
    <button onclick="goOnline()">CREAR MUNDO ONLINE</button>
    <button onclick="location.reload()">SALIR</button>
</div>

<canvas id="pixelCanvas"></canvas>

<script>
    const canvas = document.getElementById('pixelCanvas');
    const ctx = canvas.getContext('2d');
    let width = window.innerWidth, height = window.innerHeight;
    let cameraX = 5000, cameraY = 5000, zoom = 20;
    
    let pixels = new Map();
    let mode = 'solo';
    let tool = 'paint';
    let peer = null;
    let connections = []; // Lista para modo server o múltiples amigos

    // Cargar LocalStorage
    const savedData = localStorage.getItem('pixel_map');
    if (savedData) {
        pixels = new Map(JSON.parse(savedData));
    }

    function startMode(m) {
        mode = m;
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game-ui').style.display = 'block';
        document.getElementById('mode-info').innerText = m.toUpperCase();
        
        if (m === 'server') initServerMode();
        initCanvas();
    }

    function setTool(t) {
        tool = t;
        document.getElementById('btn-paint').className = t === 'paint' ? 'active-tool' : '';
        document.getElementById('btn-erase').className = t === 'erase' ? 'active-tool' : '';
    }

    // --- RED ---
    function goOnline() {
        if (peer) return alert("Ya estás online. Tu ID: " + peer.id);
        const myId = prompt("Crea una ID para tu mundo:", "mundo-" + Math.floor(Math.random()*1000));
        if (!myId) return;
        
        peer = new Peer(myId);
        peer.on('open', (id) => {
            document.getElementById('id-info').innerText = "Tu ID Online: " + id;
            alert("Mundo Online Creado. Comparte tu ID.");
        });
        peer.on('connection', setupConn);
    }

    function connectToFriend() {
        const friendId = document.getElementById('join-id').value;
        if (!friendId) return;
        peer = new Peer();
        peer.on('open', () => {
            const conn = peer.connect(friendId);
            setupConn(conn);
            startMode('amigo');
        });
    }

    function initServerMode() {
        // En un mundo real esto conectaría a un servidor. 
        // Aquí usamos una ID "Global" para que todos se encuentren.
        peer = new Peer('pixel-global-server-room'); 
        peer.on('open', () => console.log("Conectado al servidor global"));
        peer.on('connection', setupConn);
        peer.on('error', () => {
            // Si el servidor global ya está creado, nos unimos a él
            const conn = peer.connect('pixel-global-server-room');
            setupConn(conn);
        });
    }

    function setupConn(conn) {
        connections.push(conn);
        conn.on('data', (data) => {
            if (data.type === 'erase') pixels.delete(`${data.x},${data.y}`);
            else pixels.set(`${data.x},${data.y}`, data.color);
            render();
        });
    }

    // --- JUEGO ---
    function initCanvas() {
        canvas.width = width;
        canvas.height = height;
        render();
    }

    function render() {
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, width, height);

        const startX = Math.floor(cameraX - (width/2)/zoom);
        const endX = Math.ceil(cameraX + (width/2)/zoom);
        const startY = Math.floor(cameraY - (height/2)/zoom);
        const endY = Math.ceil(cameraY + (height/2)/zoom);

        pixels.forEach((color, key) => {
            const [x, y] = key.split(',').map(Number);
            if (x >= startX && x <= endX && y >= startY && y <= endY) {
                ctx.fillStyle = color;
                ctx.fillRect((x - cameraX) * zoom + width / 2, (y - cameraY) * zoom + height / 2, zoom, zoom);
            }
        });
    }

    function paint(e) {
        const worldX = Math.floor((e.clientX - width/2)/zoom + cameraX);
        const worldY = Math.floor((e.clientY - height/2)/zoom + cameraY);
        
        if (tool === 'paint') {
            const color = document.getElementById('colorPicker').value;
            pixels.set(`${worldX},${worldY}`, color);
            broadcast({ x: worldX, y: worldY, color: color, type: 'paint' });
        } else {
            pixels.delete(`${worldX},${worldY}`);
            broadcast({ x: worldX, y: worldY, type: 'erase' });
        }

        localStorage.setItem('pixel_map', JSON.stringify([...pixels]));
        render();
    }

    function broadcast(data) {
        connections.forEach(conn => {
            if (conn.open) conn.send(data);
        });
    }

    // --- CONTROLES ---
    let isDragging = false, lastX, lastY;
    canvas.onmousedown = (e) => {
        if (e.button === 0) paint(e);
        if (e.button === 2) isDragging = true;
        lastX = e.clientX; lastY = e.clientY;
    };
    window.onmousemove = (e) => {
        if (isDragging) {
            cameraX -= (e.clientX - lastX) / zoom;
            cameraY -= (e.clientY - lastY) / zoom;
            lastX = e.clientX; lastY = e.clientY;
            render();
        }
    };
    window.onmouseup = () => isDragging = false;
    window.oncontextmenu = e => e.preventDefault();
    canvas.onwheel = (e) => {
        zoom = Math.min(Math.max(e.deltaY > 0 ? zoom * 0.8 : zoom * 1.2, 0.5), 100);
        render();
    };
    window.onresize = () => { width = window.innerWidth; height = window.innerHeight; initCanvas(); };
</script>
</body>
</html>
